name: FluidNC Release Builder

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version'
        required: true

jobs:
  build:
    # MODIFICATO: Aggiunti i permessi di scrittura obbligatori per evitare l'errore 403
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: |
          ~/.platformio
        # MODIFICATO: Cambiata la chiave originale (che cercava 'lockfiles' inesistenti) 
        # collegandola a 'platformio.ini'. Ora la cache funziona davvero.
        key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
        # MODIFICATO: Aggiunto il ripristino della cache per le build successive
        restore-keys: |
          ${{ runner.os }}-platformio-
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        # pioarduino's esp_install tool (used for all esp32 release targets)
        # requires Python 3.10-3.14; see ci.yml for the same fix.
        python-version: "3.11"
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio intelhex pyyaml
    - name: config_items.yaml/.json are committed up to date
      # The release ships a freshly generated config_items.yaml/.json, and
      # consumers (e.g. FigUI) fetch the committed copies by tag from
      # ://githubusercontent.com, so refuse to release a commit whose
      # committed copies don't match its source.
      run: |
        python tools/build_config_docs.py --fail-on-drift
        git diff --exit-code -- FluidNC/docs/config_items.yaml FluidNC/docs/config_items.json
    - name: Set release version
      run: |
        git config user.email "wmb@firmworks.com"
        git config user.name "Mitch Bradley"
        git tag "${{ github.event.inputs.tag }}" -a -m "Release test"


       # Compila l'ambiente wifi dell'ESP32 standard
    - name: Build Only MKS-DLC32 WiFi
      run: platformio run -e wifi

    # MODIFICATO: Genera in automatico boot_app0.bin e poi unisce tutti i pezzi con esptool
    - name: Create Merged Binary (Direct esptool)
      run: |
        python -m pip install esptool
        esptool.py make_boot_app0 boot_app0.bin
        esptool.py --chip esp32 merge_bin -o release/fluidnc-merged-0x0.bin --flash_mode dio --flash_size 4MB 0x1000 .pio/build/wifi/bootloader.bin 0x8000 .pio/build/wifi/partitions.bin 0xe000 boot_app0.bin 0x10000 .pio/build/wifi/firmware.bin

    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.tag }}
        files: |
          release/*.zip
          release/*.elf
          release/*.bin
        draft: True
